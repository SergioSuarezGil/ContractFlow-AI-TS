syntax = "proto3";

package contractflow.v1;

// Synchronous health check used by contracts-api → workers (instant path).
// Async work continues over RabbitMQ.
service WorkerHealth {
  rpc Check (HealthCheckRequest) returns (HealthCheckResponse);
}

message HealthCheckRequest {
  string service = 1;
}

message HealthCheckResponse {
  string status = 1; // SERVING | NOT_SERVING
  string service = 2;
}
