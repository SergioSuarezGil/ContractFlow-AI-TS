# Optional observability stack (Prometheus + Grafana + Loki + Promtail).
name: contractflow

services:
  prometheus:
    container_name: contractflow-prometheus
    image: prom/prometheus:v3.2.1
    cpus: 0.10
    mem_limit: 128m
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=6h
    restart: unless-stopped

  loki:
    container_name: contractflow-loki
    image: grafana/loki:3.4.2
    cpus: 0.15
    mem_limit: 192m
    ports:
      - "127.0.0.1:3100:3100"
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    restart: unless-stopped

  promtail:
    container_name: contractflow-promtail
    image: grafana/promtail:3.4.2
    cpus: 0.10
    mem_limit: 64m
    command: ["-config.file=/etc/promtail/promtail-config.yaml"]
    volumes:
      - ./observability/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    container_name: contractflow-grafana
    image: grafana/grafana:11.5.2
    cpus: 0.10
    mem_limit: 128m
    ports:
      - "127.0.0.1:3003:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
