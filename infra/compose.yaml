name: contractflow

# Tight caps for Docker Desktop ~2 CPUs / ~2 GB.
# cpus/mem_limit are honoured by `docker compose up`.

services:
  # Standalone Mongo 7 for local Compose (lighter than Atlas Local; no broken RS after recreate).
  # Atlas Local / Vector Search can return later when Docker has more RAM.
  mongodb:
    container_name: contractflow-mongodb
    image: mongo:7.0.16
    cpus: 0.35
    mem_limit: 384m
    command: ["mongod", "--bind_ip_all", "--quiet"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  rabbitmq:
    container_name: contractflow-rabbitmq
    image: rabbitmq:3.13-management-alpine
    cpus: 0.20
    mem_limit: 192m
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-contractflow}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-contractflow}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  object-storage:
    container_name: contractflow-object-storage
    image: localstack/localstack:4.0
    cpus: 0.15
    mem_limit: 192m
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      SERVICES: s3
      DEBUG: "0"
    volumes:
      - object_storage_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  object-storage-init:
    container_name: contractflow-object-storage-init
    image: amazon/aws-cli:2.22.35
    cpus: 0.15
    mem_limit: 128m
    depends_on:
      object-storage:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-test}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-test}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint:
      - /bin/sh
      - -c
      - |
        aws --endpoint-url=http://object-storage:4566 s3 mb s3://documents || true
        aws --endpoint-url=http://object-storage:4566 s3 mb s3://reports || true
    restart: "no"

  keycloak:
    container_name: contractflow-keycloak
    image: quay.io/keycloak/keycloak:26.0.7
    # Keycloak needs room for heap + metaspace; tighter than this OOMs in start-dev.
    cpus: 0.40
    mem_limit: 640m
    command: ["start-dev", "--import-realm"]
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: 8080
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: "8080"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      JAVA_OPTS_APPEND: "-Xms64m -Xmx384m -XX:MaxMetaspaceSize=192m"
    volumes:
      - ./keycloak/realm-contractflow.json:/opt/keycloak/data/import/realm-contractflow.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s
    restart: unless-stopped

volumes:
  mongodb_data:
  rabbitmq_data:
  object_storage_data:
