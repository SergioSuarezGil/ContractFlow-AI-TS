server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: contractflow-docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
        filters:
          - name: label
            values: ["com.docker.compose.project=contractflow"]
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service
      - source_labels: ["__meta_docker_container_label_com_contractflow_git_sha"]
        target_label: git_sha
    pipeline_stages:
      - docker: {}
      - match:
          selector: '{service=~"contracts-api|ai-worker|pdf-worker"}'
          stages:
            - json:
                expressions:
                  level: level
                  msg: msg
                  context: context
                  gitSha: gitSha
            - labels:
                level:
                context:
